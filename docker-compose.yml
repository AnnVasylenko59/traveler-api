name: traveler_api_stack

services:
  # Primary (Master Database)
  postgres:
    image: postgres:16-alpine
    container_name: traveler_db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "synchronous_standby_names=*"
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-traveler_prod}
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME_PROD:-traveler_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Standby Replica (Physical Replica)
  postgres_sub:
    image: postgres:16-alpine
    container_name: traveler_replica
    restart: unless-stopped
    entrypoint: >
      sh -c "
      rm -rf /var/lib/postgresql/data/* &&
      until su-exec postgres pg_basebackup -h postgres -p 5432 -U travel_user -D /var/lib/postgresql/data -Fp -Xs -R; do
        echo 'Waiting for primary...';
        sleep 2;
      done &&
      chmod 700 /var/lib/postgresql/data &&
      exec su-exec postgres postgres -c hot_standby=on
      "
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-traveler_prod}
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME_PROD:-traveler_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: traveler_api_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-travel_user}:${DB_PASSWORD:-travel_secret_pass}@postgres:5432/${DB_NAME_PROD:-traveler_prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traveler_network

networks:
  traveler_network:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica_data: