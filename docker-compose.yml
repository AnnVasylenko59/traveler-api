name: traveler_api_stack

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: traveler_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-traveler_prod}
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME_PROD:-traveler_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: traveler_api_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-travel_user}:${DB_PASSWORD:-travel_secret_pass}@postgres:5432/${DB_NAME_PROD:-traveler_prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-travel_user}
      DB_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
      DB_NAME: ${DB_NAME_PROD:-traveler_prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traveler_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local