name: traveler_api_stack

services:
  # Primary (Master Database)
  postgres:
    image: postgres:16-alpine
    container_name: traveler_db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-traveler_prod}
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME_PROD:-traveler_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Standby Replica 1
  postgres_sub_1:
    image: postgres:16-alpine
    container_name: traveler_replica_1
    restart: unless-stopped
    entrypoint: >
      sh -c "
      rm -rf /var/lib/postgresql/data/* &&
      until PGPASSWORD=${DB_PASSWORD:-travel_secret_pass} su-exec postgres pg_basebackup -h postgres -p 5432 -U ${DB_USER:-travel_user} -D /var/lib/postgresql/data -Fp -Xs -R; do
        echo 'Waiting for primary...';
        sleep 2;
      done &&
      chmod 700 /var/lib/postgresql/data &&
      exec su-exec postgres postgres -c hot_standby=on
      "
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-traveler_prod}
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME_PROD:-traveler_prod}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Standby Replica 2
  postgres_sub_2:
    image: postgres:16-alpine
    container_name: traveler_replica_2
    restart: unless-stopped
    entrypoint: >
      sh -c "
      rm -rf /var/lib/postgresql/data/* &&
      until PGPASSWORD=${DB_PASSWORD:-travel_secret_pass} su-exec postgres pg_basebackup -h postgres -p 5432 -U ${DB_USER:-travel_user} -D /var/lib/postgresql/data -Fp -Xs -R; do
        echo 'Waiting for primary...';
        sleep 2;
      done &&
      chmod 700 /var/lib/postgresql/data &&
      exec su-exec postgres postgres -c hot_standby=on
      "
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-traveler_prod}
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_pass}
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME_PROD:-traveler_prod}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # PgCat Connection Pooler & Read/Write Splitter
  pgcat:
    image: ghcr.io/postgresml/pgcat:latest
    container_name: traveler_pgcat
    restart: unless-stopped
    volumes:
      - ./pgcat.toml:/etc/pgcat/pgcat.toml:ro
    command: ["pgcat", "/etc/pgcat/pgcat.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres_sub_1:
        condition: service_healthy
      postgres_sub_2:
        condition: service_healthy
    networks:
      - traveler_network

  # FastAPI Web Application
# FastAPI Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: traveler_api_app
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: postgresql://${DB_USER:-travel_user}:${DB_PASSWORD:-travel_secret_pass}@pgcat:6432/${DB_NAME_PROD:-traveler_prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      pgcat:
        condition: service_started
    networks:
      - traveler_network

networks:
  traveler_network:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica1_data:
  postgres_replica2_data: