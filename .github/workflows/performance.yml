name: Performance Tests (k6)

on:
  push:
    branches: [ main, master, lab2 ]
  pull_request:
    branches: [ main, master, lab2 ]
  workflow_dispatch:

jobs:
  k6-smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: traveler_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install fastapi uvicorn asyncpg pydantic python-dotenv

      - name: Initialize Database Schema
        env:
          PGPASSWORD: password
        run: |
          echo "Applying schema and init script..."
          if [ -f docs/schema.sql ]; then
            psql -h localhost -U postgres -d traveler_api -f docs/schema.sql
          fi
          if [ -f init_db.sql ]; then
            psql -h localhost -U postgres -d traveler_api -f init_db.sql
          fi

      - name: Start FastAPI Application
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/traveler_api
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: traveler_api
          PYTHONPATH: .
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          
          STARTED=false
          for i in {1..20}; do
            if curl -s http://localhost:8000/api/health > /dev/null || curl -s http://localhost:8000/health > /dev/null; then
              echo "FastAPI successfully started!"
              STARTED=true
              break
            fi
            echo "Waiting for API to be ready ($i/20)..."
            sleep 1
          done

          if [ "$STARTED" = false ]; then
            echo "================ UVICORN LOGS (CRASH) ================"
            cat uvicorn.log
            echo "======================================================"
            exit 1
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Smoke Test
        env:
          API_URL: http://localhost:8000
        run: |
          k6 run tests/performance-tests/tests/smoke-test.js